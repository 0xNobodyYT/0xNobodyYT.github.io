name: Apply v29 Rola label cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v29-rola-label.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v29
        shell: python
        run: |
          from pathlib import Path
          p=Path('sxs-primo-calculator/index.html')
          h=p.read_text(encoding='utf-8')
          if 'Planner v29' in h:
              raise SystemExit(0)
          if 'Planner v28' not in h:
              raise SystemExit('Expected v28')
          h=h.replace('Sword x Staff — Multi-Season Primostar & Realm Planner v28','Sword x Staff — Multi-Season Primostar & Realm Planner v29',1)
          h=h.replace('<input id="refreshSystem" type="text" value="0-0-0-0" placeholder="e.g. 2-2-2-2" placeholder="Ore-Gold-Essence-Sand, e.g. 8-4-6-4">','<input id="refreshSystem" type="text" value="0-0-0-0" placeholder="Ore-Rola-Essence-Sand, e.g. 8-4-6-4">',1)
          h=h.replace('return {v:28,values:v,core:JSON.parse(JSON.stringify(core))}','return {v:29,values:v,core:JSON.parse(JSON.stringify(core))}',1)
          h=h.replace('localStorage.setItem("sxsPlannerV28"','localStorage.setItem("sxsPlannerV29"',1)
          h=h.replace('localStorage.removeItem("sxsPlannerV28")','localStorage.removeItem("sxsPlannerV29")',1)
          h=h.replace('a.download="sword-x-staff-plan-v28.json"','a.download="sword-x-staff-plan-v29.json"',1)
          h=h.replace('const saved=localStorage.getItem("sxsPlannerV28")||localStorage.getItem("sxsPlannerV27")||','const saved=localStorage.getItem("sxsPlannerV29")||localStorage.getItem("sxsPlannerV28")||localStorage.getItem("sxsPlannerV27")||',1)
          h=h.replace('if(!localStorage.getItem("sxsPlannerV28"))save(true);','if(!localStorage.getItem("sxsPlannerV29"))save(true);',1)
          if 'Ore-Gold-Essence-Sand' in h: raise SystemExit('Old visible Gold label remains')
          p.write_text(h,encoding='utf-8')
      - name: Commit v29
        run: |
          git config user.name "0xNobodyYT-site-bot"
          git config user.email "0xNobodyYT-site-bot@users.noreply.github.com"
          git add sxs-primo-calculator/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finish Rola naming update"
          git push
