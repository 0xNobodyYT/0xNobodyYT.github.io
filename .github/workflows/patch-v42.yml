name: Patch calculator v42

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v42.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sxs-primo-calculator/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Sword x Staff — Multi-Season Primostar & Realm Planner v41', 'Sword x Staff — Multi-Season Primostar & Realm Planner v42', 1)
          old = '<div class="field"><label>Score / Primostar</label><input id="scorePerStar" type="number" value="100"></div>'
          new = '<div class="field"><label>Score / Primostar</label><input id="scorePerStar" type="number" value="27"></div>'
          assert old in s
          s = s.replace(old, new, 1)
          old = ' $("relicFloor").value=relicFloor;\n $("seasonFloorSummary").value=`Season ${season}: Lv${floor} · Relics +${relicFloor}`;'
          new = ' $("relicFloor").value=relicFloor;\n const scorePerStarField=$("scorePerStar");\n if(scorePerStarField){\n  if(season===1){scorePerStarField.value=100;scorePerStarField.readOnly=true;scorePerStarField.title="Season 1: 100 progression points = 1 Primostar";}\n  else if(season===2){scorePerStarField.value=27;scorePerStarField.readOnly=true;scorePerStarField.title="Season 2: 27 progression points = 1 Primostar";}\n  else {scorePerStarField.readOnly=false;scorePerStarField.title="Season 3+ Primostar conversion is not confirmed yet; enter the confirmed value manually.";}\n }\n $("seasonFloorSummary").value=`Season ${season}: Lv${floor} · Relics +${relicFloor}`;'
          assert old in s
          s = s.replace(old, new, 1)
          old = ' $("seasonRuleNote").innerHTML=`Season ${season} keeps your existing Primostar total. Seasonal scoring starts from <b>Lv${floor}</b> for Character, Gear, Skills and Fantomons, and <b>+${relicFloor}</b> for Relics. These are baselines, not caps: progress above them keeps earning the same Primostar points.`;'
          new = ' $("seasonRuleNote").innerHTML=`Season ${season} keeps your existing Primostar total. Seasonal scoring starts from <b>Lv${floor}</b> for Character, Gear, Skills and Fantomons, and <b>+${relicFloor}</b> for Relics. These are baselines, not caps. Primostar conversion: <b>${season===1?"100":season===2?"27":"manual/unconfirmed"} progression points per Primostar</b>. Category point weights stay unchanged.`;'
          assert old in s
          s = s.replace(old, new, 1)
          old = '<p class="subtle" style="margin-top:9px">Season baselines advance with progression: S1 = Lv100 / relic +10, S2 = Lv130 / +14, S3 = Lv160 / +17, then +30 normal levels and +3 relic levels each later season.</p>'
          new = '<p class="subtle" style="margin-top:9px">Season baselines advance with progression: S1 = Lv100 / relic +10, S2 = Lv130 / +14, S3 = Lv160 / +17, then +30 normal levels and +3 relic levels each later season. Primostar conversion is season-specific: <b>S1 = 100 points/star</b>, <b>S2 = 27 points/star</b>. S3+ is not confirmed yet.</p>'
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('return {v:41,values:v,core:JSON.parse(JSON.stringify(core))}', 'return {v:42,values:v,core:JSON.parse(JSON.stringify(core))}', 1)
          s = s.replace('localStorage.setItem("sxsPlannerV41"', 'localStorage.setItem("sxsPlannerV42"')
          s = s.replace('localStorage.removeItem("sxsPlannerV41")', 'localStorage.removeItem("sxsPlannerV42")')
          s = s.replace('a.download="sword-x-staff-plan-v41.json"', 'a.download="sword-x-staff-plan-v42.json"')
          old = 'const saved=localStorage.getItem("sxsPlannerV41")||localStorage.getItem("sxsPlannerV40")||'
          new = 'const saved=localStorage.getItem("sxsPlannerV42")||localStorage.getItem("sxsPlannerV41")||localStorage.getItem("sxsPlannerV40")||'
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('if(!localStorage.getItem("sxsPlannerV41"))save(true);', 'if(!localStorage.getItem("sxsPlannerV42"))save(true);', 1)
          assert 'season===2){scorePerStarField.value=27' in s
          assert 'S2 = 27 points/star' in s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit v42
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sxs-primo-calculator/index.html
          git commit -m "Fix Season 2 Primostar conversion to 27 points"
          git push
