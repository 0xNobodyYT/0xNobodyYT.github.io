name: Patch calculator v46

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v46.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('sxs-primo-calculator/index.html')
          s = p.read_text(encoding='utf-8')

          old = 'Sword x Staff — Multi-Season Primostar & Realm Planner v45'
          assert old in s, 'v45 title not found'
          s = s.replace(old, 'Sword x Staff — Multi-Season Primostar & Realm Planner v46', 1)

          s, n = re.subn(
              r'(2:\{rank:"Gold",floor:130,relicFloor:)14(,relicBase:13,)',
              r'\g<1>13\g<2>',
              s,
              count=1,
          )
          assert n == 1, 'S2 relicFloor rule not found'

          old = '<input id="relicFloor" type="number" value="14" readonly>'
          new = '<input id="relicFloor" type="number" value="13" readonly>'
          assert old in s, 'relicFloor input not found'
          s = s.replace(old, new, 1)

          old = 'relic baselines are +10, +14, +17, +20, +23 and +26.'
          new = 'relic baselines are +10, +13, +17, +20, +23 and +26.'
          assert old in s, 'relic baseline explanation not found'
          s = s.replace(old, new, 1)

          assert '2:{rank:"Gold",floor:130,relicFloor:13,relicBase:13' in s
          assert '<input id="relicFloor" type="number" value="13" readonly>' in s
          assert 'relic baselines are +10, +13, +17, +20, +23 and +26.' in s
          # Character-level relic unlock cap is a separate rule and stays +14 at Lv130.
          assert 'Lv.130 → +14' in s

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit v46
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sxs-primo-calculator/index.html
          git commit -m "Fix Season 2 relic baseline to +13"
          git push
