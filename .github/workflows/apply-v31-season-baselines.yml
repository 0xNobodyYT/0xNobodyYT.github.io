name: Apply v31 season baselines

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v31-season-baselines.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update calculator to v31
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('sxs-primo-calculator/index.html')
          h = p.read_text(encoding='utf-8')

          if 'Multi-Season Primostar & Realm Planner v31' in h:
              print('Already v31')
          else:
              if 'Multi-Season Primostar & Realm Planner v30' not in h:
                  raise SystemExit('Expected live v30 calculator not found')

              h = h.replace('Sword x Staff — Multi-Season Primostar & Realm Planner v30', 'Sword x Staff — Multi-Season Primostar & Realm Planner v31', 1)

              sync_pat = re.compile(r'function syncSeasonRules\(\)\{.*?\n\}', re.S)
              sync_new = '''function syncSeasonRules(){
               const season=currentSeasonNumber();
               const floor=100+(season-1)*30;
               const relicFloor=season===1?10:14+(season-2)*3;

               $("seasonNumber").value=season;
               $("floor").value=floor;
               $("relicFloor").value=relicFloor;
               $("seasonFloorSummary").value=`Season ${season}: Lv${floor} · Relics +${relicFloor}`;
               $("seasonRuleNote").innerHTML=`Season ${season} keeps your existing Primostar total, while seasonal progression starts from <b>Lv${floor}</b> for Character, Gear, Skills and Fantomons, and <b>+${relicFloor}</b> for Relics. Only progress above those baselines scores this season.`;

               const normalIds=["gearAllCur","gearAllTar","skillAllCur","skillAllTar","fantAllCur","fantAllTar"];
               normalIds.forEach(id=>{if($(id))$(id).placeholder=`Baseline ${floor}`});
               ["relicAllCur","relicAllTar"].forEach(id=>{if($(id))$(id).placeholder=`Baseline +${relicFloor}`});

               for(let i=0;i<5;i++){
                if($(`gearCur${i}`))$(`gearCur${i}`).placeholder=`${floor}`;
                if($(`gearTar${i}`))$(`gearTar${i}`).placeholder=`${floor}`;
               }
               for(let i=0;i<8;i++){
                if($(`skillCur${i}`))$(`skillCur${i}`).placeholder=`${floor}`;
                if($(`skillTar${i}`))$(`skillTar${i}`).placeholder=`${floor}`;
               }
               for(let i=0;i<4;i++){
                if($(`fantCur${i}`))$(`fantCur${i}`).placeholder=`${floor}`;
                if($(`fantTar${i}`))$(`fantTar${i}`).placeholder=`${floor}`;
               }
               for(let i=0;i<20;i++){
                if($(`relicCur${i}`))$(`relicCur${i}`).placeholder=`+${relicFloor}`;
                if($(`relicTar${i}`))$(`relicTar${i}`).placeholder=`+${relicFloor}`;
               }
               return {season,floor,relicFloor}
              }'''
              h, n = sync_pat.subn(sync_new, h, count=1)
              if n != 1: raise SystemExit('syncSeasonRules replacement failed')

              h = h.replace('Season progression baseline', 'Season scoring baseline')
              h = h.replace('<input id="floor" type="number" value="100" readonly>', '<input id="floor" type="number" value="130" readonly>', 1)
              h = h.replace('<input id="relicFloor" type="number" value="10" readonly>', '<input id="relicFloor" type="number" value="14" readonly>', 1)

              h = re.sub(r'<p class="subtle" style="margin-top:9px">At the start of every season, progression scoring resets to the same baseline:.*?</p>', '<p class="subtle" style="margin-top:9px">Season baselines advance with progression: S1 = Lv100 / relic +10, S2 = Lv130 / +14, S3 = Lv160 / +17, then +30 normal levels and +3 relic levels each later season.</p>', h, count=1, flags=re.S)
              h = re.sub(r'<div class="notice">Multi-season scoring uses the same category weights:.*?</div>', '<div class="notice">Multi-season scoring keeps the same category weights: Character 100, Gear 38, Skill 13, Fantomon 14 and Relic 57 per seasonal level. Primostars carry forward, while the scoring baseline advances by season: S1 Lv100/+10, S2 Lv130/+14, S3 Lv160/+17, then +30/+3 thereafter.</div>', h, count=1, flags=re.S)
              h = re.sub(r'<div class="notice warn" style="margin-top:8px">Character EXP progress is fractional for score\..*?</div>', '<div class="notice warn" style="margin-top:8px">Character EXP progress is fractional for score. Example: in Season 2, projected Lv158.5 is 28.5 seasonal character levels above the Lv130 baseline, worth 2,850 character points. Relic cap unlocks still require completed whole character levels.</div>', h, count=1, flags=re.S)

              h = h.replace('$("ratingChip").textContent=`Season ${seasonInfo.season} · baseline Lv100`;', '$("ratingChip").textContent=`Season ${seasonInfo.season} · baseline Lv${seasonInfo.floor}`;', 1)
              h = h.replace('Primostars are cumulative across seasons, while Character, Gear, Skills and Fantomons reset to the Lv100 scoring baseline and Relics reset to +10 each season.', 'Primostars are cumulative across seasons, while the seasonal scoring baseline advances with the selected season (S1 Lv100/+10, S2 Lv130/+14, S3 Lv160/+17, then +30/+3).')

              h = h.replace('return {v:30,values:v,core:JSON.parse(JSON.stringify(core))}', 'return {v:31,values:v,core:JSON.parse(JSON.stringify(core))}', 1)
              h = h.replace('localStorage.setItem("sxsPlannerV30"', 'localStorage.setItem("sxsPlannerV31"', 1)
              h = h.replace('localStorage.removeItem("sxsPlannerV30")', 'localStorage.removeItem("sxsPlannerV31")', 1)
              h = h.replace('a.download="sword-x-staff-plan-v30.json"', 'a.download="sword-x-staff-plan-v31.json"', 1)

              old_loader = 'const saved=localStorage.getItem("sxsPlannerV30")||localStorage.getItem("sxsPlannerV29")||localStorage.getItem("sxsPlannerV28")||localStorage.getItem("sxsPlannerV27")||localStorage.getItem("sxsPlannerV26")||localStorage.getItem("sxsPlannerV25")||localStorage.getItem("sxsPlannerV24");'
              new_loader = 'const saved=localStorage.getItem("sxsPlannerV31")||localStorage.getItem("sxsPlannerV30")||localStorage.getItem("sxsPlannerV29")||localStorage.getItem("sxsPlannerV28")||localStorage.getItem("sxsPlannerV27")||localStorage.getItem("sxsPlannerV26")||localStorage.getItem("sxsPlannerV25")||localStorage.getItem("sxsPlannerV24");'
              if old_loader not in h: raise SystemExit('v30 loader not found')
              h = h.replace(old_loader, new_loader, 1)
              h = h.replace('if(!localStorage.getItem("sxsPlannerV30"))save(true);', 'if(!localStorage.getItem("sxsPlannerV31"))save(true);', 1)

              checks = [
                'Multi-Season Primostar & Realm Planner v31',
                'const floor=100+(season-1)*30;',
                'const relicFloor=season===1?10:14+(season-2)*3;',
                'S2 = Lv130 / +14',
                'S3 = Lv160 / +17',
                'sxsPlannerV31'
              ]
              missing = [x for x in checks if x not in h]
              if missing: raise SystemExit(f'Validation failed: {missing}')
              p.write_text(h, encoding='utf-8')

      - name: Commit calculator and remove temporary updater
        run: |
          git config user.name "0xNobodyYT-site-bot"
          git config user.email "0xNobodyYT-site-bot@users.noreply.github.com"
          git add sxs-primo-calculator/index.html
          git rm .github/workflows/apply-v31-season-baselines.yml
          git commit -m "Fix season-specific progression baselines"
          git push
