name: Patch calculator v39

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v39.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator to v39
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sxs-primo-calculator/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Sword x Staff — Multi-Season Primostar & Realm Planner v38', 'Sword x Staff — Multi-Season Primostar & Realm Planner v39', 1)
          s = s.replace('  <p class="subtle">Season-floor reference: <a href="https://www.prydwen.gg/sword-x-staff/guides/beginner-guide" target="_blank" rel="noopener noreferrer">Prydwen seasonal guide</a>. EXP-save cross-check: <a href="https://eog.gg/games/sword-x-staff/guides/season-2-prep/" target="_blank" rel="noopener noreferrer">Eden of Gaming season preparation guide</a>.</p>\n', '', 1)
          s = s.replace('return {v:38,values:v,core:JSON.parse(JSON.stringify(core))}', 'return {v:39,values:v,core:JSON.parse(JSON.stringify(core))}', 1)
          s = s.replace('localStorage.setItem("sxsPlannerV38"', 'localStorage.setItem("sxsPlannerV39"', 1)
          s = s.replace('a.download="sword-x-staff-plan-v38.json"', 'a.download="sword-x-staff-plan-v39.json"', 1)
          s = s.replace('localStorage.removeItem("sxsPlannerV38")', 'localStorage.removeItem("sxsPlannerV39")', 1)
          old = 'const saved=localStorage.getItem("sxsPlannerV38")||localStorage.getItem("sxsPlannerV37")||'
          new = 'const saved=localStorage.getItem("sxsPlannerV39")||localStorage.getItem("sxsPlannerV38")||localStorage.getItem("sxsPlannerV37")||'
          s = s.replace(old, new, 1)
          s = s.replace('if(!localStorage.getItem("sxsPlannerV38"))save(true);', 'if(!localStorage.getItem("sxsPlannerV39"))save(true);', 1)
          if 'Season-floor reference:' in s or 'EXP-save cross-check:' in s:
              raise SystemExit('Reference line was not removed')
          if 'Planner v39' not in s:
              raise SystemExit('Version bump failed')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sxs-primo-calculator/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Remove season reference links (v39)"
          git push
