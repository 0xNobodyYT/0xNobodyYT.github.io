name: Inspect Formation Breaker
on:
  push:
    paths:
      - '.github/workflows/inspect-formation-breaker.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant combat data
        run: |
          node <<'NODE'
          const fs = require('fs');
          let s = fs.readFileSync('sxs-loadout-builder/combat-data.js','utf8').trim();
          s = s.replace(/^window\.SXS_COMBAT_DATA\s*=\s*/, '').replace(/;\s*$/, '');
          const C = JSON.parse(s);
          const id = '10092';
          const skill = C.skills[id];
          const out = { qualities: C.qualities, skill };
          if (skill?.groupId) {
            out.group = C.skillGroups?.[skill.groupId] || null;
            out.groupCurves = {};
            for (const [rank, curveId] of Object.entries(out.group || {})) {
              const rows = C.skillFixedCurves?.[curveId] || C.skillPassiveCurves?.[curveId] || null;
              out.groupCurves[rank] = { curveId, row105: rows?.['105'] || rows?.[105] || null, row106: rows?.['106'] || rows?.[106] || null, row107: rows?.['107'] || rows?.[107] || null };
            }
          }
          out.statuses = (skill?.statusEffects || []).map(st => {
            const groups = C.skillGroups?.[st.groupId] || {};
            const curves = {};
            for (const [rank, curveId] of Object.entries(groups)) {
              const rows = C.skillPassiveCurves?.[curveId] || C.skillFixedCurves?.[curveId] || null;
              curves[rank] = { curveId, row105: rows?.['105'] || rows?.[105] || null, row106: rows?.['106'] || rows?.[106] || null, row107: rows?.['107'] || rows?.[107] || null };
            }
            return { status: st, groups, curves };
          });
          if (skill?.passive) out.passive = skill.passive;
          fs.writeFileSync('formation-inspect.json', JSON.stringify(out, null, 2) + '\n');
          NODE
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formation-inspect.json
          git commit -m "Add temporary Formation Breaker inspection output" || exit 0
          git push
