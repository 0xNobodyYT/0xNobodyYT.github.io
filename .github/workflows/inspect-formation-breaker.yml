name: Inspect Formation Breaker
on:
  push:
    paths:
      - '.github/workflows/inspect-formation-breaker.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search fixed/passive curves
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('sxs-loadout-builder/combat-data.js','utf8').trim().replace(/^window\.SXS_COMBAT_DATA\s*=\s*/,'').replace(/;\s*$/,'');
          const C=JSON.parse(s);
          const out={};
          const ids=['1824','1834','1844','1854'];
          out.selected={};
          for(const id of ids){
            out.selected[id]={fixed106:C.skillFixedCurves?.[id]?.['106']||null,passive106:C.skillPassiveCurves?.[id]?.['106']||null};
          }
          function scan(table){
            const hits=[];
            for(const [id,rows] of Object.entries(table||{})){
              const row=rows?.['106']; if(!row) continue;
              const keys=Object.keys(row);
              const statusKeys=keys.filter(k=>/status|add/i.test(k));
              const near25=Object.entries(row).filter(([k,v])=>typeof v==='number' && v>=24800 && v<=25200);
              const near17600=Object.entries(row).filter(([k,v])=>typeof v==='number' && v>=17400 && v<=17800);
              if(statusKeys.length||near25.length||near17600.length) hits.push({id,statusKeys,status:Object.fromEntries(statusKeys.map(k=>[k,row[k]])),near25,near17600});
              if(hits.length>=200) break;
            }
            return hits;
          }
          out.fixedHits=scan(C.skillFixedCurves);
          out.passiveHits=scan(C.skillPassiveCurves);
          fs.writeFileSync('formation-curve-search.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formation-curve-search.json
          git commit -m "Add temporary Formation Breaker curve search" || exit 0
          git push
