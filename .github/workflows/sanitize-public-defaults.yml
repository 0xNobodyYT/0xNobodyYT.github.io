name: Deploy Sword x Staff calculator v27

on:
  push:
    branches: [main]
    paths:
      - .github/deploy-v27.py
      - .github/deploy-v27-trigger
      - .github/workflows/sanitize-public-defaults.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v27 calculator update
        run: python .github/deploy-v27.py

      - name: Commit calculator
        run: |
          git config user.name "0xNobodyYT-site-bot"
          git config user.email "0xNobodyYT-site-bot@users.noreply.github.com"
          git add sxs-primo-calculator/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy multi-season Primostar calculator v27"
          git push
